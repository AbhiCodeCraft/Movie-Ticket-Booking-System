services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ticket_booking
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket_booking"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
